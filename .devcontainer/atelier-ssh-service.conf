# Drop-in systemd (voir Dockerfile : copie dans
# /etc/systemd/system/ssh.service.d/atelier.conf) : sshd ne doit jamais
# demarrer avant que authorized_keys ait ete ecrit (ou que la tentative ait
# echoue proprement), sans quoi une fenetre de demarrage laisserait sshd
# actif sans aucune cle chargee (pas une ouverture, PasswordAuthentication
# etant desactivee — mais autant eviter la course).
[Unit]
After=atelier-ssh-authorized-key.service
Requires=atelier-ssh-authorized-key.service
