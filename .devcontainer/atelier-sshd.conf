# Drop-in sshd_config (voir Dockerfile : copie dans
# /etc/ssh/sshd_config.d/). Cle publique uniquement (voir
# atelier-fetch-ssh-authorized-key.sh) : jamais de mot de passe, jamais
# root, seul l'utilisateur vscode (celui qui execute le devcontainer) peut
# se connecter — memes garanties que ttyd/code-server (Basic Auth), mais
# via SSH pour exec_in_workshop (crates/api-server/src/exec.rs, depot
# atelier).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers vscode
